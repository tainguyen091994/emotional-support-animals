<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here · Three Doors</title>
<meta name="robots" content="noindex">
<style>
  @font-face { font-family: 'Newsreader'; src: url(fonts/Newsreader-normal.woff2) format('woff2'); font-weight: 300 500; font-display: swap; }
  @font-face { font-family: 'Geist'; src: url(fonts/Geist-normal.woff2) format('woff2'); font-weight: 300 600; font-display: swap; }
  :root { --page: #0b0a09; --ink: #efe9df; --muted: #a39c90; --accent: #ffd400; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--page); color: var(--ink); }
  body { display: grid; place-items: center; text-align: center; padding: 24px; font: 400 17px/1.5 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .k { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 400 clamp(36px, 7vw, 68px)/1.05 'Newsreader', Georgia, serif; margin-top: 14px; }
  p { margin-top: 12px; color: var(--muted); }
  a { display: inline-flex; align-items: center; min-height: 48px; margin-top: 28px; padding: 0 24px; border-radius: 999px; background: var(--accent); color: #121212; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="k">Gallery closed</div>
  <h1>Nothing hangs here.</h1>
  <p>This wall is empty. The rest of the building is open.</p>
  <a id="home" href="/">Back to the entrance</a>
</main>
<script>
  // GitHub Pages serves this site under /three-doors/; Vercel serves it at the root
  if (/\.github\.io$/.test(location.hostname)) document.getElementById('home').href = '/three-doors/';
</script>
</body>
</html>
